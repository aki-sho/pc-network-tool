<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Network Tool</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/cards.css" />
  <link rel="stylesheet" href="./styles/tables.css" />
  <link rel="stylesheet" href="./styles/tabs.css" />
</head>
<body>
  <header class="app-header">
    <h1>PC Network Tool</h1>
    <button id="reloadButton" class="reload-button">再取得</button>
  </header>

  <main class="app-main">
    <section class="panel">
      <h2>概要</h2>
      <div id="summaryRoot"></div>
    </section>

    <section class="panel">
      <h2>アダプタ一覧</h2>
      <div id="adaptersRoot"></div>
    </section>

    <section class="panel">
      <h2>IP / DNS</h2>
      <p class="panel-note">「-」は設定がないか、Windowsから値を取得できなかった項目です。</p>
      <div id="ipDnsRoot"></div>
    </section>

    <section class="panel">
      <h2>接続中の基本情報</h2>
      <div id="portsRoot"></div>
    </section>

    <section class="panel">
      <h2>About</h2>
      <div id="aboutRoot"></div>
    </section>
  </main>

  <script type="module" src="./renderer/renderer.js"></script>
</body>
</html>
